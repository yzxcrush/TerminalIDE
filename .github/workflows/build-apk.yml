name: Build release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13（Chaquopy 构建期依赖）
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Accept Android SDK licenses & install components
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
          [ -n "$SDKMANAGER" ] || { echo "sdkmanager 未找到"; exit 1; }
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build and sign APK
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_release.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerminalIDE-arm64-v8a-release
          path: release/TerminalIDE-arm64-v8a-release.apk
